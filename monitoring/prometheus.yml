global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: webhook
    static_configs: [{ targets: ["webhook:8001"] }]
  - job_name: orchestrator
    static_configs: [{ targets: ["orchestrator-worker:9100"] }]
  - job_name: reviewer
    static_configs: [{ targets: ["reviewer-worker:9100"] }]
  - job_name: learner
    static_configs: [{ targets: ["learner-worker:9100"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
