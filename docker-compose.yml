name: pr-reviewer

# Every app container runs the same image; only `gateway` builds it (`./setup.sh start` runs the build first).
x-app: &app
  image: pr-reviewer:dev
  pull_policy: never
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://reviewer:reviewer@postgres:5432/reviewer
    REDIS_URL: redis://redis:6379/0
    WEBHOOK_SERVICE_URL: http://webhook:8001
  volumes:
    - ./secrets:/app/secrets:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

# Celery workers fork several processes, so Prometheus runs in multiprocess mode: the directory is emptied at start,
# each child writes its own mmap files, and the parent serves the sum on :9100 (common/worker_metrics.py).
x-worker-env: &worker-env
  <<: *app-env
  PROMETHEUS_MULTIPROC_DIR: /tmp/prom
  METRICS_PORT: "9100"

x-http-health: &http-health
  interval: 10s
  timeout: 3s
  retries: 5

services:
  postgres:
    image: postgres:16-alpine
    container_name: prr-postgres
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    ports:
      - "5435:5432"   # 5434 is SwarmAI's
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer -d reviewer"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: prr-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Public entry point — the tunnel (and in AWS, the ALB) points here.
  gateway:
    <<: *app
    container_name: prr-gateway
    build: .
    command: ["uvicorn", "services.gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      webhook: { condition: service_healthy }
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]

  # Internal only: no host port, reachable just from the compose network.
  webhook:
    <<: *app
    container_name: prr-webhook
    command: ["uvicorn", "services.webhook.app:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]

  orchestrator-worker:
    <<: *app
    container_name: prr-orchestrator
    environment: *worker-env
    command: ["sh", "-c", "rm -rf $$PROMETHEUS_MULTIPROC_DIR && mkdir -p $$PROMETHEUS_MULTIPROC_DIR &&
              exec celery -A services.orchestrator.worker worker -Q review -n orchestrator@%h --loglevel=INFO --concurrency=4"]

  reviewer-worker:
    <<: *app
    container_name: prr-reviewer
    environment: *worker-env
    command: ["sh", "-c", "rm -rf $$PROMETHEUS_MULTIPROC_DIR && mkdir -p $$PROMETHEUS_MULTIPROC_DIR &&
              exec celery -A services.reviewer.worker worker -Q post -n reviewer@%h --loglevel=INFO --concurrency=2"]

  learner-worker:
    <<: *app
    container_name: prr-learner
    environment: *worker-env
    command: ["sh", "-c", "rm -rf $$PROMETHEUS_MULTIPROC_DIR && mkdir -p $$PROMETHEUS_MULTIPROC_DIR &&
              exec celery -A services.learner.worker worker -Q learn -n learner@%h --loglevel=INFO --concurrency=1"]

  # --- monitoring -------------------------------------------------------------------------------------------------
  redis-exporter:  # Celery queue depth: Redis list lengths of the review/post/learn queues
    image: oliver006/redis_exporter:v1.67.0
    container_name: prr-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=review,db0=post,db0=learn
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prr-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: prr-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # local only
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pr-reviewer.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3030:3000"   # 3000 is taken on this machine
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
