# Public entry point: the ALB Ingress routes /webhook/github here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below the replica count during a rollout
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:   # spread replicas across availability zones
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      containers:
        - name: app
          image: pr-reviewer
          command: ["uvicorn", "services.gateway.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: pr-reviewer-config }
            - secretRef: { name: pr-reviewer-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: github-app-key, mountPath: /app/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: github-app-key
          secret: { secretName: github-app-key, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway }
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
