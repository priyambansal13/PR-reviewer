# Celery workers, one Deployment per queue so each scales on its own.
# Workers are I/O-bound (waiting on OpenAI/GitHub), so CPU autoscaling is a poor fit; see optional/keda-scaledobject.yaml
# for scaling on queue length.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-worker
  labels: { app.kubernetes.io/name: orchestrator-worker }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      automountServiceAccountToken: false
      # acks_late: a task interrupted by a rollout goes back on the queue; give running LLM calls time to finish
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: pr-reviewer
          # emptyDir survives container restarts inside a pod, so clear stale multiprocess metric files first
          command: ["sh", "-c", "rm -rf $PROMETHEUS_MULTIPROC_DIR && mkdir -p $PROMETHEUS_MULTIPROC_DIR &&
                    exec celery -A services.orchestrator.worker worker -Q review -n orchestrator@$HOSTNAME --loglevel=INFO --concurrency=4"]
          envFrom:
            - configMapRef: { name: pr-reviewer-config }
            - secretRef: { name: pr-reviewer-secrets }
          env:
            - { name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/prom }
            - { name: METRICS_PORT, value: "9100" }
          ports:
            - { name: metrics, containerPort: 9100 }
          livenessProbe:   # the parent process serves metrics; if it's gone, the worker is gone
            tcpSocket: { port: metrics }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: github-app-key, mountPath: /app/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: github-app-key
          secret: { secretName: github-app-key, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
