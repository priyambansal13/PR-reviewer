# NOT applied by kustomize — a template. In AWS, keep these in Secrets Manager and sync them with the
# External Secrets Operator (or create once with `kubectl create secret ... --from-env-file`). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: pr-reviewer-secrets
  namespace: pr-reviewer
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://reviewer:CHANGE_ME@pr-reviewer.xxxxxxxx.us-east-1.rds.amazonaws.com:5432/reviewer
  REDIS_URL: rediss://master.pr-reviewer.xxxxxx.use1.cache.amazonaws.com:6379/0   # ElastiCache, TLS
  GITHUB_APP_ID: "0000000"
  GITHUB_WEBHOOK_SECRET: CHANGE_ME
  INTERNAL_TOKEN: CHANGE_ME
  ADMIN_API_TOKEN: CHANGE_ME   # bearer token for the gateway's /api/...
  OPENAI_API_KEY: CHANGE_ME
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app-key
  namespace: pr-reviewer
type: Opaque
stringData:
  github-app.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGE_ME
    -----END RSA PRIVATE KEY-----
