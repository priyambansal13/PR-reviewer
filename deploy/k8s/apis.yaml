# Internal service APIs (admin/inspection). Reached only through the gateway's authenticated /api/<service>/...
# The Celery workers that do the work are in workers.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels: { app.kubernetes.io/name: orchestrator }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below the replica count during a rollout
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:   # spread replicas across availability zones
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: orchestrator }
      containers:
        - name: app
          image: pr-reviewer
          command: ["uvicorn", "services.orchestrator.app:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers"]
          ports:
            - { name: http, containerPort: 8002 }
          envFrom:
            - configMapRef: { name: pr-reviewer-config }
            - secretRef: { name: pr-reviewer-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: github-app-key, mountPath: /app/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: github-app-key
          secret: { secretName: github-app-key, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels: { app.kubernetes.io/name: orchestrator }
spec:
  selector: { app.kubernetes.io/name: orchestrator }
  ports:
    - { name: http, port: 8002, targetPort: http }
---
