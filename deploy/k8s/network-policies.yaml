# Default deny inbound, then open exactly what's needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# gateway: from the ALB (target-type ip sends traffic straight to pod IPs inside the VPC)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-alb
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8000 }]
      from:
        - ipBlock: { cidr: 10.0.0.0/16 }   # the VPC CIDR
---
# webhook: only from the gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-from-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: webhook }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8001 }]
      from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
---
# service APIs: only from the gateway (its authenticated /api/... proxy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apis-from-gateway
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [orchestrator, reviewer, learner] }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8002 }, { port: 8003 }, { port: 8004 }]
      from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
---
# metrics: only from Prometheus (namespace "monitoring", e.g. kube-prometheus-stack)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-prometheus
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8000 }, { port: 8001 }, { port: 8002 }, { port: 8003 }, { port: 8004 }, { port: 9100 }]
      from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
