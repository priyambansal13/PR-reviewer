name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres and Redis, on the same host ports as docker-compose, so the tests run unchanged.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviewer
          POSTGRES_PASSWORD: reviewer
          POSTGRES_DB: reviewer
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U reviewer -d reviewer" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://reviewer:reviewer@localhost:5435/reviewer
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations (up, down, up)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q
      - name: Dashboard is up to date
        run: |
          uv run python monitoring/build_dashboard.py
          git diff --exit-code monitoring/grafana/dashboards/

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render with kustomize and validate against the Kubernetes schemas
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:latest-alpine \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 /w/rendered.yaml

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pr-reviewer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
